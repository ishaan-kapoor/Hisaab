[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hisaab"
version = "0.1.0"
description = "Personal Finance Tracker - Parse bank statements into Beancount/Ledger format"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beancount>=3.2",
    "fava>=1.30",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "pdfplumber>=0.11",
    "typer>=0.25",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
hisaab = "hisaab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hisaab*"]
